root@homepage:/opt/homepage/config# cat settings.yaml
# =============================================================================
# Homepage Settings Configuration
# https://gethomepage.dev/configs/settings/
#
# Sections:
#   - Branding:       Browser tab title
#   - Background:     Wallpaper with blur/brightness/opacity tuning
#   - Appearance:     Theme, color, card and header style
#   - Layout:         Per-group display mode and column count.
#                     Group names must exactly match services.yaml and
#                     bookmarks.yaml or settings will not apply.
#   - Miscellaneous:  Language, version visibility
#   - Access Control: Restricts dashboard to allowed hostnames only.
#
# Sensitive values: /opt/homepage/config/.env
# =============================================================================

# =============================================================================
# Branding
# =============================================================================
title: jkr-lab

# =============================================================================
# Background
# =============================================================================
background:
  image: /images/jkr-lab_bg.jpg
  blur: sm
  saturate: 60
  brightness: 55
  opacity: 50

# =============================================================================
# Appearance
# =============================================================================
cardBlur: sm
theme: dark
color: slate
headerStyle: underlined

# =============================================================================
# Layout — Services
# style: row  — services display left to right
# columns: N  — cards per row before wrapping
# =============================================================================
layout:
  Gateway:
    style: row
    columns: 3
  Infrastructure:
    style: row
    columns: 2
  Security:
    style: row
    columns: 2
  Monitoring:
    style: row
    columns: 4
  Media:
    style: row
    columns: 3
  Acquisition:
    style: row
    columns: 2
  Media Pipeline:
    style: row
    columns: 2
  Sandbox:
    style: row
    columns: 4

# =============================================================================
# Layout — Bookmarks
# =============================================================================
bookmarksStyle: row
bookmarks:
  Tech & Dev:
    columns: 4
  Security:
    columns: 5
  Tools:
    columns: 4
  Entertainment:
    columns: 2
  Career:
    columns: 2

# =============================================================================
# Miscellaneous
# =============================================================================
hideVersion: true
language: en

# =============================================================================
# Access Control
# Returns 403 for any request not arriving via the allowed hostname.
# =============================================================================
allowed_hostnames:
  - homepage.jkr-lab.ca