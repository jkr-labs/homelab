# =============================================================================
# Homepage Settings Configuration
# https://gethomepage.dev/configs/settings/
#
# This file controls the global appearance, layout, and access settings
# for the Homepage dashboard.
#
# Sections:
#   - Branding:      Tab title shown in the browser
#   - Background:    Wallpaper image with blur/brightness/opacity tuning
#   - Appearance:    Theme, color palette, card style, header style
#   - Layout:        Per-group display mode (row/column) and column count.
#                    Group names here must exactly match group names in
#                    services.yaml or they will not apply.
#   - Miscellaneous: Language, version visibility
#   - Access Control: Restricts which hostnames can serve the dashboard.
#                    Prevents accidental exposure if a new reverse proxy
#                    entry is added without thinking.
#
# Sensitive values are stored in environment variables.
# See: https://gethomepage.dev/configs/settings/#environment-variables
# Define them in: /opt/homepage/config/.env
# =============================================================================

# =============================================================================
# Branding
# =============================================================================
title: jkr-lab

# =============================================================================
# Background
# =============================================================================
background:
  image: /images/jkr-lab_bg.jpg
  blur: sm
  saturate: 70
  brightness: 55
  opacity: 75

# =============================================================================
# Appearance
# =============================================================================
cardBlur: sm
theme: dark
color: slate
headerStyle: underlined

# =============================================================================
# Layout
# Group names must exactly match those in services.yaml.
# style: row   — services display left to right in a horizontal row
# columns: N   — how many service cards per row before wrapping
# =============================================================================
layout:
  Gateway:
    style: row
    columns: 3
  Control Plane:
    style: row
    columns: 3
  Infrastructure:
    style: row
    columns: 3
  Security:
    style: row
    columns: 2
  Observability:
    style: row
    columns: 4
  Media:
    style: row
    columns: 4
  Acquisition:
    style: row
    columns: 2
  Media Pipeline:
    style: row
    columns: 3
  Sandbox:
    style: row
    columns: 2

# =============================================================================
# Miscellaneous
# =============================================================================
hideVersion: true
language: en

# =============================================================================
# Access Control
# Restricts the dashboard to requests arriving via this hostname only.
# If Homepage is ever accidentally exposed on a new domain or IP, it will
# return 403 — preventing unintended access.
# =============================================================================
allowed_hostnames:
  - homepage.jkr-lab.ca