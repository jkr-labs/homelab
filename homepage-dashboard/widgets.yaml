# =============================================================================
# Homepage Widgets Configuration
# https://gethomepage.dev/configs/info-widgets/
#
# Global info widgets displayed at the top of the dashboard (in order):
#   - Greeting  — Welcome message
#   - Weather   — Current conditions via OpenMeteo (no API key required)
#   - Search    — Google search bar
#   - DateTime  — Current date and time
#
# Sensitive values (coordinates, timezone): /opt/homepage/config/.env
# =============================================================================

# =============================================================================
# Greetings
# =============================================================================
- greeting:
    text_size: 4xl
    text: "Why So Serious?"

# =============================================================================
# Search
# =============================================================================
- search:
    provider: google
    focus: false
    target: _blank

# =============================================================================
# Datetime
# =============================================================================
- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: long
      hourCycle: h12
      hour12: true
      
# =============================================================================
# Weather
# =============================================================================
- openmeteo:
    latitude: "{{HOMEPAGE_VAR_WEATHER_LAT}}"
    longitude: "{{HOMEPAGE_VAR_WEATHER_LON}}"
    timezone: "{{HOMEPAGE_VAR_WEATHER_ZONE}}"
    units: metric
    cache: 5