# =============================================================================
# Homepage Services Configuration
# https://gethomepage.dev/configs/services/
#
# Sensitive values are stored as environment variables in:
# /opt/homepage/config/.env
# Referenced as: {{HOMEPAGE_VAR_YOUR_VAR_NAME}}
#
# Network segments:
#   192.168.1.x  — Gateway (OPNsense, AdGuard, NPM)
#   192.168.2.x  — Infrastructure (Proxmox, Portainer)
#   192.168.3.x  — Security (Wazuh)
#   192.168.4.x  — Observability (Grafana, Prometheus, Uptime Kuma)
#   192.168.5.x  — Media (Immich, Jellyfin, Kavita, Navidrome)
#   192.168.6.x  — Acquisition (qBittorrent, Seerr)
#   192.168.7.x  — Media Pipeline (Bazarr, Prowlarr, Radarr, Sonarr)
#
# Widget URLs use http://<service>.jkr-lab.wgt:<port> — internal hostnames
# defined in /etc/hosts on the Homepage container, not proxied through NPM.
# Service URLs use https://<service>.jkr-lab.ca — proxied through NPM,
# DNS resolved via Cloudflare.
# Services using direct IPs or external APIs are noted inline.
# =============================================================================

##############################################################################
# Gateway
##############################################################################
- Gateway:

    - OPNsense:
        icon: opnsense.png
        href: https://192.168.1.1
        description: Firewall & Router
        widget:
          type: opnsense
          url: https://192.168.1.1
          username: "{{HOMEPAGE_VAR_OPNSENSE_KEY}}"
          password: "{{HOMEPAGE_VAR_OPNSENSE_SECRET}}"

    - AdGuard Home:
        icon: adguard-home.png
        href: http://192.168.1.1:8080
        description: DNS & Ad Blocker
        widget:
          type: adguard
          url: http://192.168.1.1:8080
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    - Nginx Proxy Manager:
        icon: nginx.png
        href: https://nginx.jkr-lab.ca
        description: Reverse Proxy

##############################################################################
# Infrastructure
##############################################################################
- Infrastructure:

    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.jkr-lab.ca
        description: Hypervisor
        widget:
          type: proxmox
          url: https://192.168.2.22:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
          node: jkr-lab

    - Portainer:
        icon: portainer.png
        href: https://portainer.jkr-lab.ca
        description: Container Manager
        widget:
          type: portainer
          url: https://192.168.3.32:9443
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

##############################################################################
# Security
##############################################################################
- Security:

    - CrowdSec:
        icon: crowdsec.png
        href: https://app.crowdsec.net/security-engines
        description: Threat Intelligence
 
    - Wazuh:
        icon: wazuh.png
        href: https://wazuh.jkr-lab.ca
        description: SIEM & Threat Monitor

##############################################################################
# Monitoring
##############################################################################
- Monitoring:

    - Change Detection:
        icon: changedetection.png
        href: https://changedetection.jkr-lab.ca
        description: Website Change Monitor
        widget:
          type: changedetectionio
          url: http://changedetection.jkr-lab.wgt:5000
          key: "{{HOMEPAGE_VAR_CHANGEDETECTION_KEY}}"

    - Grafana:
        icon: grafana.png
        href: https://grafana.jkr-lab.ca
        description: Metrics Dashboard
        widget:
          type: grafana
          url: http://grafana.jkr-lab.wgt:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
          key: "{{HOMEPAGE_VAR_GRAFANA_KEY}}"

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.jkr-lab.ca/targets
        description: Metrics Collector
        widget:
          type: prometheus
          url: http://prometheus.jkr-lab.wgt:9090

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime.jkr-lab.ca
        description: Service Uptime Monitor
        widget:
          type: uptimekuma
          url: http://uptime.jkr-lab.wgt:3001
          slug: "{{HOMEPAGE_VAR_UPTIMEKUMA_SLUG}}"

