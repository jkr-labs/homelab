# =============================================================================
# Homepage Services Configuration
# https://gethomepage.dev/configs/services/
#
# This file defines all services displayed on the Homepage dashboard,
# organized by logical network segment / function.
#
# Each service has:
#   - icon:        PNG filename or Material Design Icon (mdi-*)
#   - href:        Public HTTPS URL via Caddy reverse proxy
#   - description: Short label shown under the service name
#   - widget:      (optional) Live data pulled via the *.jkr-lab.wgt HTTP
#                  internal domain to avoid HTTPS overhead on widget polling.
#                  Widgets that use external APIs (Tailscale, Proxmox) connect
#                  directly via IP or external URL.
#
# Sensitive values (API keys, passwords) are stored as environment variables.
# Define them in: /opt/homepage/config/.env
# Reference them as: {{HOMEPAGE_VAR_YOUR_VAR_NAME}}
#
# Network segments:
#   192.168.1.x  — Gateway (OPNsense, AdGuard)
#   192.168.2.x  — Control Plane (Proxmox, Home Assistant)
#   192.168.3.x  — Infrastructure (Authentik, Portainer)
#   192.168.4.x  — Security (Wazuh)
#   192.168.5.x  — Observability (Grafana, Prometheus, Uptime Kuma, etc.)
#   192.168.6.x  — Media (Immich, Jellyfin, Kavita, Navidrome)
#   192.168.7.x  — Acquisition (qBittorrent, Seerr)
#   192.168.8.x  — Media Pipeline (Bazarr, Kapowarr, Lidarr, Prowlarr,
#                  Radarr, Sonarr)
#   192.168.3.32 — Sandbox (intentionally vulnerable apps, LAN-isolated)
#
# Widget URL note:
#   Most widgets use http://<service>.jkr-lab.wgt:<port> — these are internal
#   HTTP-only hostnames resolved by AdGuard/local DNS to avoid TLS overhead
#   on frequent widget polling. Caddy does not proxy these; they are LAN-only.
#   Services without a .wgt entry either use the external API (Tailscale),
#   a direct IP (Proxmox, OPNsense), or have no widget (Caddy, CrowdSec,
#   Wazuh, Sandbox apps).
# =============================================================================

##############################################################################
# Gateway
##############################################################################
- Gateway:

    - OPNsense:
        icon: opnsense.png
        href: https://192.168.1.1
        description: Firewall & Router
        widget:
          type: opnsense
          url: https://192.168.1.1
          username: "{{HOMEPAGE_VAR_OPNSENSE_KEY}}"
          password: "{{HOMEPAGE_VAR_OPNSENSE_SECRET}}"

    - AdGuard Home:
        icon: adguard-home.png
        href: https://adguard.jkr-lab.ca
        description: DNS & Ad Blocker
        widget:
          type: adguard
          url: http://192.168.1.1:8080
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"

    - Caddy:
        icon: caddy.png
        href: https://caddy.jkr-lab.ca
        description: Reverse Proxy
        # No widget — Caddy's admin API is bound to localhost:2019 only.
        # Exposing it externally would be a security risk.

##############################################################################
# Control Plane
##############################################################################
- Control Plane:

    - Proxmox:
        icon: proxmox.png
        href: https://proxmox.jkr-lab.ca
        description: Hypervisor
        widget:
          type: proxmox
          url: https://192.168.2.22:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_SECRET}}"
          node: jkr-lab

    - Home Assistant:
        icon: home-assistant.png
        href: https://homeassistant.jkr-lab.ca
        description: Home Automation
        widget:
          type: homeassistant
          url: http://192.168.2.1:8123
          key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_KEY}}"
          # Note: HA runs plain HTTP internally, so widget connects directly
          # via IP rather than the .wgt domain. No .wgt entry exists for HA.

##############################################################################
# Infrastructure
##############################################################################
- Infrastructure:

    - Authentik:
        icon: authentik.png
        href: https://authentik.jkr-lab.ca
        description: SSO & Identity Provider
        widget:
          type: authentik
          url: http://authentik.jkr-lab.wgt:9000
          key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"

    - Portainer:
        icon: portainer.png
        href: https://portainer.jkr-lab.ca
        description: Container Manager
        widget:
          type: portainer
          url: https://192.168.3.32:9443
          env: 1
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
          # Note: Portainer forces HTTPS internally, so widget connects
          # directly via IP:9443. No .wgt entry exists for Portainer.

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com
        description: Remote Access VPN
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          # Note: Tailscale widget uses the external Tailscale API directly.
          # No internal URL or .wgt entry needed.

##############################################################################
# Security
##############################################################################
- Security:

    - CrowdSec:
        icon: crowdsec.png
        href: https://app.crowdsec.net/security-engines
        description: Threat Intelligence
        # No widget — CrowdSec widget requires the local agent API which is
        # not exposed. Management is done via the CrowdSec cloud console.

    - Wazuh:
        icon: wazuh.png
        href: https://wazuh.jkr-lab.ca
        description: SIEM & Threat Monitor
        # No widget — Homepage does not have a native Wazuh widget type.

##############################################################################
# Observability
##############################################################################
- Observability:

    - Change Detection:
        icon: changedetection.png
        href: https://changedetection.jkr-lab.ca
        description: Website Change Monitor
        widget:
          type: changedetectionio
          url: http://changedetection.jkr-lab.wgt:5000
          key: "{{HOMEPAGE_VAR_CHANGEDETECTION_KEY}}"

    - Grafana:
        icon: grafana.png
        href: https://grafana.jkr-lab.ca
        description: Metrics Dashboard
        widget:
          type: grafana
          url: http://grafana.jkr-lab.wgt:3000
          username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
          password: "{{HOMEPAGE_VAR_GRAFANA_PASS}}"
          key: "{{HOMEPAGE_VAR_GRAFANA_KEY}}"

    - Prometheus:
        icon: prometheus.png
        href: https://prometheus.jkr-lab.ca/targets
        description: Metrics Collector · /targets
        widget:
          type: prometheus
          url: http://prometheus.jkr-lab.wgt:9090

    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime.jkr-lab.ca
        description: Service Uptime Monitor
        widget:
          type: uptimekuma
          url: http://uptime.jkr-lab.wgt:3001
          slug: "{{HOMEPAGE_VAR_UPTIMEKUMA_SLUG}}"

