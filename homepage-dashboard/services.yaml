##############################################################################
# Sandbox
# Intentionally vulnerable apps, isolated from internet.
# Never expose to WAN. OPNsense firewall rules enforce network isolation.
# No widgets — these apps have no Homepage widget support and are
# monitoring targets in Uptime Kuma only.
##############################################################################
- Sandbox:

    - DVGA:
        icon: mdi-graphql
        href: https://dvga.jkr-lab.ca
        description: Damn Vulnerable GraphQL API

    - DVWA:
        icon: mdi-shield-bug-outline
        href: https://dvwa.jkr-lab.ca
        description: Damn Vulnerable Web App

    - Juice Shop:
        icon: mdi-cup-water
        href: https://juiceshop.jkr-lab.ca
        description: OWASP Juice Shop

    - WebGoat:
        icon: mdi-shield-bug-outline
        href: https://webgoat.jkr-lab.ca/WebGoat
        description: OWASP WebGoat